[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "libera-forensics"
version = "1.0.0"
description = "Local-first forensic case platform with traceable AI assistance and a reproducible research benchmark."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Christian Simbolon" }, { name = "Libera project contributors" }]
keywords = ["digital forensics", "DFIR", "RAG", "local LLM", "provenance", "case management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]
workbench = ["streamlit>=1.38", "pandas>=2.2"]
report = ["pillow>=10", "python-docx>=1.1"]

[project.scripts]
libera = "libera_platform.cli:main"

[project.urls]
Repository = "https://github.com/krissimbolon/libera"

[tool.setuptools.packages.find]
where = ["."]
include = ["libera_platform*", "src*"]
namespaces = true

[tool.setuptools.package-data]
"libera_platform.resources" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

name: Build Final ChatSim

on:
  push:
    branches:
      - p3-p10-final-integration
    paths:
      - 'apps/libera-chatsim/**'
      - 'tools/build_demo_seed.py'
      - 'data/adaptasi_indonesia/corpus_whatsapp_10000.csv'
      - 'data/adaptasi_indonesia/registri_aktor_indonesia.csv'
      - '.github/workflows/build-chatsim-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build examiner-safe seed from frozen P2
        run: python tools/build_demo_seed.py
      - name: Verify seed manifest
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path('apps/libera-chatsim/app/src/main/assets/seed_manifest.json')
          m = json.loads(p.read_text(encoding='utf-8'))
          assert m['source_corpus_sha256'] == 'a014a02ebad298a33267da8631f3a2d1906a537ae558c1849622904c225467e6'
          assert m['source_row_count'] == 10000
          assert m['device_message_count'] == 9997
          assert m['source_anomaly_count'] == 3
          assert m['device_id'] == 'DEV-SIM-001'
          print(json.dumps(m, indent=2, ensure_ascii=False))
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p apps/libera-chatsim assembleDebug
      - name: Upload APK and seed manifest
        uses: actions/upload-artifact@v4
        with:
          name: libera-chatsim-final-debug
          retention-days: 7
          path: |
            apps/libera-chatsim/app/build/outputs/apk/debug/app-debug.apk
            apps/libera-chatsim/app/src/main/assets/seed_manifest.json

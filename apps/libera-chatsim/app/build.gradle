plugins {
    id 'com.android.application'
}

android {
    namespace 'id.libera.chatsim'
    compileSdk 35

    defaultConfig {
        applicationId "id.libera.chatsim"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
        }
    }
}
